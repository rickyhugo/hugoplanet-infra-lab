---
config:
  spec:
    destination:
      server: https://kubernetes.default.svc
    source:
      repoURL: https://github.com/rickyhugo/hugoplanet-infra-lab.git
      targetRevision: main

applications:
  - name: argo-cd
    namespace: argocd
    prune: false
  - name: tailscale-operator
    namespace: tailscale
    annotations:
      argocd.argoproj.io/sync-wave: "1"
  - name: tailscale-load-balancer
    namespace: tailscale
    annotations:
      argocd.argoproj.io/sync-wave: "2"
  - name: dns-config
    namespace: dns-config
    annotations:
      argocd.argoproj.io/sync-wave: "3"
  - name: cert-manager
    namespace: cert-manager
    annotations:
      argocd.argoproj.io/sync-wave: "4"
  - name: ingress
    namespace: ingress
    annotations:
      argocd.argoproj.io/sync-wave: "5"
